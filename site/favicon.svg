<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <rect width="128" height="128" rx="28" fill="#111315"/>
  <!-- Teal Link (Underneath) -->
  <line x1="38" y1="90" x2="90" y2="38" stroke="#2dd4bf" stroke-width="12" stroke-linecap="round"/>
  <!-- Lime Link (On Top) -->
  <line x1="38" y1="38" x2="90" y2="90" stroke="#a3e635" stroke-width="12" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="38" cy="38" r="15" fill="#a3e635"/>
  <circle cx="90" cy="38" r="15" fill="#2dd4bf"/>
  <circle cx="38" cy="90" r="15" fill="#2dd4bf"/>
  <circle cx="90" cy="90" r="15" fill="#a3e635"/>
</svg>